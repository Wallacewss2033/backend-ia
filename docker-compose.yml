version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
    networks:
      - app-network
    depends_on:
      - mysql
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx_web
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - laravel
    restart: unless-stopped

  # langflow:
  #   image: logspace/langflow:latest
  #   container_name: langflow_app
  #   ports:
  #     - "7860:7860"
  #   environment:
  #     # Optional: connect langflow to the same mysql DB
  #     - LANGFLOW_DATABASE_URL=mysql+pymysql://app_user:secretpassword@mysql:3306/app_db
  #   networks:
  #     - app-network
  #   depends_on:
  #     - mysql
  #   restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysqldata:
  redisdata:
